name: Deploy site

on:
  push:
    branches: [master, main]
    paths:
      - "site/**"
      - "tools/**"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "site/**"
      - "tools/**"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    # Keep the build OS stable when GitHub migrates ubuntu-latest.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3" # Track the latest patch release in the 3.3 series.
          bundler-cache: true
      - name: Setup Python 🐍
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: tools/requirements.txt
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "site/_config.yml"
          propertyPath: "giscus.repo"
          value: ${{ github.repository }}
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install -r tools/requirements.txt
          export JEKYLL_ENV=production
          bash tools/build.sh
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c tools/purgecss.config.js
      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
